name: Hostpoint SMTP connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticate-without-sending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Authenticate to Hostpoint without sending email
        env:
          WORKFLOWOS_SMTP_HOST: asmtp.mail.hostpoint.ch
          WORKFLOWOS_SMTP_PORT: "587"
          WORKFLOWOS_SMTP_USERNAME: Marvin.Caushi@elektro-af.ch
          WORKFLOWOS_SMTP_PASSWORD: ${{ secrets.HOSTPOINT_SMTP_PASSWORD }}
          WORKFLOWOS_SMTP_FROM: Marvin.Caushi@elektro-af.ch
          WORKFLOWOS_SMTP_FROM_NAME: A&F Elektro GmbH
          WORKFLOWOS_SMTP_LIVE_ENABLED: "false"
        run: python -m workflowos.cli check-hostpoint-smtp
