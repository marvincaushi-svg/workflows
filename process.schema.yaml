{
  "schema_version": "1.0",
  "process": {
    "id": "pv-assignment-intake-v2",
    "name": "PV assignment intake and responsibility routing",
    "readiness_scope": "assignment_intake_only",
    "goal": {
      "id": "pv-assignment-ready",
      "description": "Capture the SB assignment and route technical production to A&F without inventing missing project data."
    },
    "responsibilities": {
      "assignment_owner": "sb_energetica",
      "available_project_data_provider": "sb_energetica",
      "technical_document_owner": "af_elektro",
      "grid_operator_manager": "af_elektro",
      "af_elektro_deliverables": [
        "tag_grid_connection_application",
        "installation_notice_ia",
        "single_line_diagram",
        "system_sizing"
      ]
    },
    "intake": {
      "required_channel": "email",
      "project_data_policy": "accept_available_without_making_it_mandatory",
      "optional_project_data": {
        "artifact_types": [
          "optimizer_qr_map",
          "signed_architectural_layout",
          "roofing_plan",
          "pv_design_report",
          "string_diagram",
          "system_sizing",
          "mounting_report",
          "bill_of_materials"
        ],
        "fact_paths": [
          "requested_start_date"
        ]
      }
    },
    "checklist": {
      "required_artifacts": [
        {
          "id": "assignment-email",
          "artifact_type": "assignment_email",
          "description": "Assignment or request email"
        }
      ],
      "required_facts": []
    },
    "states": {
      "initial": "new",
      "ready": "ready",
      "blocked": "blocked"
    }
  }
}
